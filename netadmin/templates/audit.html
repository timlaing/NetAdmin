{% extends "base.html" %}{% block content %}<h1 class="h2">Audit log</h1><div class="table-responsive"><table class="table table-sm"><thead><tr><th>Unix time</th><th>User</th><th>Action</th><th>Target</th><th>Result</th></tr></thead><tbody>{% for event in events %}<tr><td>{{ event.occurred_at }}</td><td>{{ event.username }}</td><td>{{ event.action }}</td><td>{{ event.target }}</td><td>{{ 'Success' if event.success else 'Rejected' }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
