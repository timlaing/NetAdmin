# NetAdmin Kea DHCPv4 fixture: redacted lab values in the shape the config
# assembler produces. The real daemon must accept this file; the smoke test
# in Tools/smoke_dhcp_kea.sh runs `kea-dhcp4 -t` over the whole directory.
{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "dhcp-socket-type": "udp"
    },
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "name": "/var/lib/kea/dhcp4.leases"
    },
    "reservations-global": true,
    "valid-lifetime": 3600,
    "max-valid-lifetime": 7200,
    "authoritative": true,
    "dhcp-ddns": {
      "enable-updates": true,
      "ncr-protocol": "UDP",
      "ncr-format": "JSON"
    },
    "client-classes": [
      {
        "name": "PXEClient-UEFI-x64",
        "test": "option[93].hex == 0x0007"
      },
      {
        "name": "PXEClient-UEFI-x86",
        "test": "option[93].hex == 0x0006"
      }
    ],
    "subnet4": [
      {
        "id": 1,
        "subnet": "192.0.2.0/24",
        # Office LAN
        "pools": [
          { "pool": "192.0.2.100 - 192.0.2.199" }
        ],
        "option-data": [
          { "name": "routers", "data": "192.0.2.1" },
          { "name": "domain-name-servers", "data": "192.0.2.1" },
          { "name": "domain-name", "data": "lan.example" }
        ]
      },
      {
        "id": 2,
        "subnet": "198.51.100.0/24",
        "pools": [
          { "pool": "198.51.100.50 - 198.51.100.99" }
        ],
        "option-data": [
          { "name": "domain-name-servers", "data": "198.51.100.1" },
          { "name": "routers", "data": "198.51.100.1" }
        ]
      }
    ],
    <?include "/etc/dhcp/netadmin-reservations.json"?>,
    "control-sockets": [
      { "socket-type": "unix", "socket-name": "kea4-ctrl.sock" }
    ],
    "loggers": [
      { "name": "*", "severity": "INFO" }
    ]
  }
}
