name: NetAdmin
version: "0.4.1"
slug: netadmin
description: Secure Bind, DHCP and RADIUS administration
url: https://github.com/timlaing/net-admin
image: "ghcr.io/timlaing/{arch}-addon-netadmin"
arch: [amd64, aarch64]
startup: services
init: false
ingress: true
# Store artwork is loaded automatically from icon.png beside this file.
# The ingress sidebar uses a Material Design icon instead.
panel_icon: mdi:lan
panel_admin: false
map: [addon_config:rw]
options:
  dhcp_backend: isc
  dns_server: dns.internal
  dns_zones: ""
  dhcp_agent_url: https://dhcp.internal:8081
  radius_agent_url: https://radius.internal:8082
schema:
  dhcp_backend: list(isc|kea)
  dns_server: str
  dns_zones: str?
  dhcp_agent_url: url
  radius_agent_url: url
