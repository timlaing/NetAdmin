configuration:
  dhcp_backend:
    name: DHCP backend
    description: >-
      Backend the deployed DHCP agent runs: isc (ISC DHCPD) or kea. Pick the one
      your agent actually uses; this only labels the UI and does not migrate or
      reconfigure the DHCP server.
  dns_server:
    name: DNS server
    description: >-
      Reachable hostname or IP address of Bind. The hostname must match the
      certificate it presents to the agents.
  dns_zones:
    name: DNS zones
    description: >-
      Optional comma-separated authoritative zones, for example
      example.net,2.0.192.in-addr.arpa. Leave empty to discover zones from the
      running Bind configuration.
  dhcp_agent_url:
    name: DHCP agent URL
    description: >-
      HTTPS endpoint of the NetAdmin DHCP agent. The hostname must match its TLS
      certificate.
  radius_agent_url:
    name: RADIUS agent URL
    description: >-
      HTTPS endpoint of the NetAdmin RADIUS agent. The hostname must match its
      TLS certificate.
