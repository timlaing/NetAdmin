[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netadmin"
version = "0.1.0"
description = "Home network DNS, DHCP and RADIUS administration"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-WTF>=1.2,<2",
  "WTForms>=3.2,<4",
  "dnspython>=2.7,<3",
  "gunicorn>=23,<24",
  "httpx>=0.28,<1",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pylint>=3.3,<4",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-WTForms>=3.2",
]

[project.scripts]
netadmin = "netadmin.wsgi:main"
netadmin-dhcp-agent = "netadmin.agents.dhcp:main"
netadmin-radius-agent = "netadmin.agents.radius:main"

[tool.setuptools.packages.find]
include = ["netadmin*"]

[tool.setuptools.package-data]
netadmin = ["templates/*.html", "static/*.css"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["netadmin"]

[tool.pytest.ini_options]
addopts = "--cov=netadmin --cov-report=term-missing --cov-fail-under=60"
testpaths = ["tests"]

[tool.pylint.main]
py-version = "3.12"
load-plugins = []

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = ["duplicate-code", "too-few-public-methods"]

[tool.pylint.basic]
good-names = ["P", "R"]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8

[[tool.mypy.overrides]]
module = ["flask_wtf", "flask_wtf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["netadmin.forms", "netadmin.app", "netadmin.agents.dhcp", "netadmin.agents.radius"]
disable_error_code = ["misc", "untyped-decorator"]
