version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github_actions]
    groups:
      codeql-actions:
        patterns: [github/codeql-action/*]
      release-drafter-actions:
        patterns: [release-drafter/release-drafter*]
    open-pull-requests-limit: 5
  # uv ecosystem, not pip: uv update PRs regenerate uv.lock alongside
  # pyproject.toml. pip only bumps the manifest, leaving uv.lock stale and
  # failing `uv sync --locked` in CI (hit on main 2026-10-24: #18 / fixed #22).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, python]
    groups:
      python-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/, /docker, /home-assistant/netadmin]
    schedule:
      interval: weekly
    labels: [dependencies, containers]
    groups:
      container-bases:
        patterns: ['*']
    open-pull-requests-limit: 5
