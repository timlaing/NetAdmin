name: Bug report
description: Report a reproducible problem using sanitized data.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Do not include TSIG secrets, RADIUS shared secrets or password hashes, lease files, zone files or service configurations. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: NetAdmin version or commit, Home Assistant/Core and architecture, Bind/DHCPD/FreeRADIUS versions, and add-on or docker-compose deployment.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and sanitized evidence
    validations:
      required: true
