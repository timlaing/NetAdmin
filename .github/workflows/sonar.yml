name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary :all: "uv==0.13.1"
          uv sync --locked --no-build --extra dev
      - name: Run tests and generate Python coverage
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m coverage xml
      # Quality-gate waiting is intentionally disabled for now: SonarCloud
      # never computes a gate verdict for this project's main-branch analyses
      # (every branch analysis has an empty new-code period, so the gate status
      # comes back NONE and the scanner exits 3 even with zero open issues).
      # The public API exposes no endpoint to set the new-code period. Once a
      # New Code period is configured in the project UI (Project -> New Code),
      # restore -Dsonar.qualitygate.wait=true here to re-enforce the gate.
      # PR-context gate evaluation continues via the SonarCloud app check.
      - name: Analyze
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
