name: Lint

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

jobs:
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔍 Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -euo pipefail
          curl --proto =https --proto-redir =https -fsSLo /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto =https --proto-redir =https -fsSLo /tmp/actionlint-checksums.txt "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cp /tmp/actionlint.tar.gz "/tmp/$archive"
          (cd /tmp && grep " $archive$" actionlint-checksums.txt | sha256sum -c -)
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint

      - name: 🚦 Run actionlint
        run: /tmp/actionlint -color

  shellcheck:
    name: Shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🐚 Run ShellCheck
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -z '*.sh' | xargs -0 -n1)
          shellcheck --severity=warning "${files[@]}"

  addon:
    name: Home Assistant add-on schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🚀 Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: home-assistant/netadmin
          community: false
